name: Build installers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Source tag, e.g. v0.2.1"
        required: true
        type: string

permissions:
  contents: write

env:
  SOURCE_REPO: Anime2Real/Chobits-Chii-LiveTalk
  SOURCE_REF: ${{ github.event.release.tag_name || github.event.inputs.version }}

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}
          path: source
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: source
      - run: pnpm build
        working-directory: source
      - run: pnpm exec electron-builder --linux --x64 --publish always
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}
          path: source
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: source
      - run: pnpm build
        working-directory: source
      - run: pnpm exec electron-builder --linux --arm64 --publish always
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mac-arm64:
    runs-on: macos-14
    env:
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}
          path: source
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: source
      - run: pnpm build
        working-directory: source
      - run: pnpm exec electron-builder --mac --arm64 --publish always
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mac-x64:
    runs-on: macos-15-intel
    env:
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}
          path: source
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: source
      - run: pnpm build
        working-directory: source
      - run: pnpm exec electron-builder --mac --x64 --publish always
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-x64:
    runs-on: windows-latest
    env:
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}
          path: source
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: source
      - run: pnpm build
        working-directory: source
      - run: pnpm exec electron-builder --win --x64 --publish always
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
